name: Deploy FiadoApp → Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload via FTPS
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔐 Gerar config/conexao.php a partir dos secrets
        run: |
          cat > config/conexao.php << 'EOF'
          <?php
          $host = "${{ secrets.DB_HOST }}";
          $db   = "${{ secrets.DB_NAME }}";
          $user = "${{ secrets.DB_USER }}";
          $pass = "${{ secrets.DB_PASS }}";
          try {
              $pdo = new PDO("mysql:host=$host;dbname=$db;charset=utf8", $user, $pass);
              $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          } catch (PDOException $e) {
              die("Erro na conexao: " . $e->getMessage());
          }
          EOF

      - name: 🚀 Deploy via FTPS para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # FTPS (FTP com TLS) — resolve o timeout na porta 21
          port: 21
          security: loose         # Aceita certificado auto-assinado da Hostinger
          server-dir: /public_html/
          timeout: 60000          # 60s — evita timeout em deploys maiores
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            android/**
            *.zip
            *.sql
            README.md
            PROMPT_FIADOAPP.md