name: Deploy FiadoApp → Hostinger

on:
  push:
    branches:
      - main  # dispara apenas quando fizer push na branch main

jobs:
  deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # necessário para detectar apenas arquivos alterados

      - name: 🚀 Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/  # pasta raiz do site na Hostinger
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            *.zip
            *.sql